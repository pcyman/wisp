services:
  credentials:
    image: ${WISP_CREDENTIALS_IMAGE:-wisp-credentials:local}
    build:
      context: ./credentials
      args:
        BOTO3_VERSION: ${BOTO3_VERSION:-1.35.99}
    environment:
      - WISP_AWS_ALIAS=${WISP_AWS_ALIAS:-}
      - WISP_AWS_AUTHORIZATION_TOKEN=${WISP_AWS_AUTHORIZATION_TOKEN:-}
      - WISP_CONFIG=/run/wisp/config.toml
      - WISP_AWS_SSO_CACHE_SOURCE=/run/aws/sso-cache
      - AWS_CONFIG_FILE=/home/broker/.aws/config
      - AWS_SDK_LOAD_CONFIG=1
      - HOME=/home/broker
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_SECURITY_TOKEN
      - AWS_PROFILE
      - AWS_DEFAULT_PROFILE
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_EC2_METADATA_DISABLED
    labels:
      wisp.managed: "true"
      wisp.kind: credentials
      wisp.owner-uid: "${WISP_UID:-1000}"
      wisp.project-hash: "${WISP_PROJECT_HASH:-unknown}"
      wisp.version: "${WISP_CLI_VERSION:-development}"
    user: "${WISP_UID:-1000}:${WISP_GID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /home/broker/.aws/sso/cache:uid=${WISP_UID:-1000},gid=${WISP_GID:-1000},mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9911/health', timeout=2).read()"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 1s

  sandbox:
    image: ${WISP_IMAGE:-wisp:local}
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-}
        HUNK_VERSION: ${HUNK_VERSION:-}
        AWS_CLI_VERSION: ${AWS_CLI_VERSION:-}
        KUBECTL_VERSION: ${KUBECTL_VERSION:-}
        HELM_VERSION: ${HELM_VERSION:-}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-}
        GO_VERSION: ${GO_VERSION:-}
    environment:
      HOME: /home/sandbox
      KUBECONFIG: /home/sandbox/.kube/config
      TERM: ${TERM:-}
      COLORTERM: ${COLORTERM:-}
    labels:
      wisp.managed: "true"
      wisp.kind: sandbox
      wisp.owner-uid: "${WISP_UID:-1000}"
      wisp.project-hash: "${WISP_PROJECT_HASH:-unknown}"
      wisp.version: "${WISP_CLI_VERSION:-development}"
    init: true
    tmpfs:
      - /home/sandbox:uid=${WISP_UID:-1000},gid=${WISP_GID:-1000},mode=0700
    working_dir: /workspace/current
